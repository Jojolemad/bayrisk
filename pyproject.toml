[project]
name = "bayrisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Axel B", email = "axel.bernuchon@insa-lyon.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
]

[project.scripts]
bayrisk = "bayrisk:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "sphinx>=9.2.0",
    "sphinx-autodoc-typehints>=3.17.7",
    "sphinx-copybutton>=0.5.2",
    "sphinx-toolbox>=4.1.2",
    "sphinxcontrib-bibtex>=2.7.0",
]
